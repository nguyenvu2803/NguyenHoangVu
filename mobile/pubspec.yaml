name: nguyen_hoang_vu
description: NguyenHoangVu - Ung dung cham cong nhan vien.
publish_to: none
version: 1.3.1+5
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  camera: 0.12.1
  image: ^4.5.4
  http: ^1.4.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  geolocator: ^14.0.1
  mobile_scanner: ^7.0.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  intl: ^0.20.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  google_mlkit_translation: ^0.15.1
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
