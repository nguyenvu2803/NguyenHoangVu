# Optional personal deployment. APK currently uses the shared API.
# Creates a free web service; no database or paid resource is created.
services:
  - type: web
    name: nguyenhoangvu-api
    runtime: node
    plan: free
    rootDir: backend_shared
    buildCommand: npm ci && npm run models:fetch
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TIME_ZONE
        value: Asia/Ho_Chi_Minh
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: apps_script
      - key: OTP_RELAY_URL
        sync: false
      - key: OTP_RELAY_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_FULL_NAME
        value: Nguyễn Hoàng Vũ
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
