name: Verify NguyenHoangVu
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend_shared/package-lock.json
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        working-directory: backend_shared
      - run: npm run models:fetch
        working-directory: backend_shared
      - run: npm test
        working-directory: backend_shared
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend_shared/package-lock.json
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        working-directory: backend_shared
      - run: npm run models:fetch
        working-directory: backend_shared
      - run: python3 scripts/test_backend_integration.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --release --dart-define-from-file=config/production.example.json
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: NguyenHoangVu-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
