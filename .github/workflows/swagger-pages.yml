name: Publish Swagger UI
on:
  push:
    branches: [main]
    paths: ['backend_shared/src/**', 'backend_shared/tool/build-swagger-site.js', 'backend_shared/package*.json', '.github/workflows/swagger-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: swagger-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend_shared/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend_shared
      - run: node tool/build-swagger-site.js ../dist/swagger-site
        working-directory: backend_shared
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/swagger-site
      - uses: actions/deploy-pages@v4
        id: deploy
