# Use when deploying this folder as a standalone backend repository.
# For the monorepo use ../render.yaml (rootDir: backend_shared).
# Creates no database; supply an existing PostgreSQL connection securely.
services:
  - type: web
    name: nguyenhoangvu-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run models:fetch
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ONNXRUNTIME_NODE_INSTALL
        value: skip
      - key: TRUST_PROXY
        value: "true"
      - key: APP_TIME_ZONE
        value: Asia/Ho_Chi_Minh
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: apps_script
      - key: OTP_RELAY_URL
        sync: false
      - key: OTP_RELAY_SECRET
        sync: false
